<!DOCTYPE html>
<html>
<head>
    <title>Vue Lab</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        .nav-bar {
            background-color: #f5f5f5;
            padding: 10px;
            margin-bottom: 20px;
        }
        .cart {
            background-color: #3498db;
            color: white;
            padding: 10px 15px;
            margin-bottom: 20px;
            border-radius: 5px;
            font-weight: bold;
            display: inline-block;
        }
        .product-display {
            display: flex;
            margin-bottom: 20px;
        }
        .product-image {
            width: 300px;
            height: 300px;
            border: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f9f9f9;
        }
        .product-image img {
            max-width: 100%;
            max-height: 100%;
        }
        .product-info {
            padding: 20px;
        }
        .color-circle {
            width: 50px;
            height: 50px;
            margin: 8px 10px 8px 0;
            border: 2px solid #d8d8d8;
            border-radius: 50%;
            display: inline-block;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .color-circle:hover {
            border-color: #3498db;
            transform: scale(1.1);
        }
        .button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .add-to-cart {
            background-color: #27ae60;
            color: white;
        }
        .add-to-cart:hover {
            background-color: #219a52;
        }
        .remove-from-cart {
            background-color: #e74c3c;
            color: white;
        }
        .remove-from-cart:hover {
            background-color: #c0392b;
        }
        .disabledButton {
            background-color: #d8d8d8 !important;
            cursor: not-allowed !important;
            color: #95a5a6 !important;
        }
        .disabledButton:hover {
            background-color: #d8d8d8 !important;
        }
        /* product-details 样式 */
        .product-details {
            margin: 15px 0;
        }
        .details-list {
            list-style-type: disc;
            margin-left: 20px;
        }
        .details-list li {
            margin: 5px 0;
            color: #555;
        }
        /* review-form 样式 */
        .review-form {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .review-form label {
            display: block;
            margin: 10px 0 5px;
            font-weight: bold;
        }
        .review-form input,
        .review-form textarea,
        .review-form select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .review-form h3 {
            margin-top: 0;
            color: #2c3e50;
        }
        /* review-list 样式 */
        .review-container {
            margin: 20px 0;
        }
        .review-container h3 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
        }
        .review-container ul {
            list-style-type: none;
            padding: 0;
        }
        .review-container li {
            background-color: #f8f9fa;
            margin: 10px 0;
            padding: 15px;
            border-left: 4px solid #3498db;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="nav-bar"></div>
        <div class="cart">Cart({{ cart.length }})</div>
        <product-display :premium="premium" @add-to-cart="updateCart" @remove-from-cart="removeFromCart"></product-display>
    </div>
    
    <!-- Import Js -->
    <script src="./components/ProductDisplay.js"></script>
    <script src="./components/ReviewForm.js"></script>
    <script src="./components/ReviewList.js"></script>
    <script src="./main.js"></script>
</body>
</html>
